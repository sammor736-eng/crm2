<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123d74" />
  <title>World Explorer Quiz</title>
  <style>
    :root{--ink:#17324d;--muted:#6a7f95;--card:#fff;--bg1:#eef7ff;--bg2:#fff8df;--blue:#1e73d8;--green:#1aa66a;--red:#e04b4b;--yellow:#ffd84d;--shadow:0 18px 50px rgba(34,72,112,.14)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 10%,#d9efff 0 18%,transparent 38%),radial-gradient(circle at 85% 80%,#fff0b8 0 16%,transparent 34%),linear-gradient(145deg,var(--bg1),#f8fbff 52%,var(--bg2));display:flex;justify-content:center;align-items:center;padding:18px}
    .app{width:min(760px,100%)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(20px,4vw,28px);letter-spacing:-.5px}.brand .globe{font-size:1.3em}
    .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:rgba(255,255,255,.82);border:1px solid rgba(27,74,119,.1);backdrop-filter:blur(8px);border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(30,80,130,.08)}
    .card{background:rgba(255,255,255,.95);border:1px solid rgba(17,74,126,.08);border-radius:30px;box-shadow:var(--shadow);padding:clamp(20px,5vw,38px);text-align:center;overflow:hidden;position:relative}
    .progress{height:8px;background:#e9f0f6;border-radius:99px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#3b8ff0,#45c67b);border-radius:99px;transition:width .35s ease}
    .eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;font-weight:900;color:var(--blue);margin-bottom:8px}
    h1{font-size:clamp(27px,6vw,42px);line-height:1.08;letter-spacing:-1px;margin:0 0 10px}.sub{color:var(--muted);font-weight:650;margin:0 0 22px}
    .name-wrap{max-width:480px;margin:18px auto 20px;text-align:left}.name-wrap label{display:block;font-size:14px;font-weight:900;margin:0 0 8px}.name-input{width:100%;border:2px solid #dfe9f2;background:#fff;border-radius:16px;padding:14px 16px;font-size:18px;color:var(--ink);outline:none}.name-input:focus{border-color:#72ace8;box-shadow:0 0 0 4px rgba(30,115,216,.1)}
    .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.mode{border:2px solid #dfe9f2;background:#fff;border-radius:20px;padding:18px 12px;cursor:pointer;color:var(--ink);font:inherit;transition:.16s transform,.16s border-color,.16s background}.mode:hover{transform:translateY(-2px);border-color:#9bc8f6;background:#f8fcff}.mode:active{transform:scale(.99)}.mode-icon{font-size:44px;display:block;margin-bottom:8px}.mode strong{display:block;font-size:17px}.mode small{display:block;color:var(--muted);font-weight:700;margin-top:5px;line-height:1.25}
    .visual{height:190px;display:flex;align-items:center;justify-content:center;margin:4px 0 24px}.flag{max-width:min(330px,84vw);max-height:180px;border-radius:16px;box-shadow:0 12px 30px rgba(29,55,80,.19);border:1px solid rgba(0,0,0,.08);background:#f6f8fa}.big-emoji{font-size:112px;line-height:1;filter:drop-shadow(0 10px 20px rgba(40,70,110,.14))}.logo-img{width:min(220px,55vw);height:150px;object-fit:contain;padding:18px;border-radius:22px;background:white;box-shadow:0 12px 30px rgba(29,55,80,.12);border:1px solid rgba(0,0,0,.06)}
    .answers{display:grid;gap:12px;text-align:left}.answer{width:100%;border:2px solid #dfe9f2;background:#fff;border-radius:18px;padding:16px 18px;font-size:18px;font-weight:850;color:var(--ink);cursor:pointer;transition:.16s transform,.16s border-color,.16s background;display:flex;align-items:center;gap:12px}.answer:hover{transform:translateY(-2px);border-color:#9bc8f6;background:#f8fcff}.answer:active{transform:scale(.99)}.answer .letter{display:grid;place-items:center;min-width:32px;height:32px;border-radius:10px;background:#edf5fd;color:var(--blue);font-size:14px}.answer.correct{border-color:#58c996;background:#ecfbf4;color:#116d49}.answer.wrong{border-color:#f28f8f;background:#fff0f0;color:#9f2d2d}.answer:disabled{cursor:default;transform:none}
    .feedback{min-height:54px;margin:17px 0 0;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center}.feedback.ok{color:#16875b}.feedback.no{color:#c13f3f}
    .menu-btn{margin-top:12px;border:0;background:transparent;color:#5f7590;font-weight:850;font-size:14px;cursor:pointer;padding:10px 14px;border-radius:12px}.menu-btn:hover{background:#f0f5fa}
    .mini{font-size:12px;color:#8293a5;margin-top:15px}.hidden{display:none!important}
    .spark{position:absolute;font-size:22px;animation:pop .8s ease-out forwards;pointer-events:none}@keyframes pop{0%{transform:translate(0,20px) scale(.2);opacity:0}40%{opacity:1}100%{transform:translate(var(--x),-110px) rotate(var(--r));opacity:0}}
    @media(max-width:620px){body{align-items:flex-start;padding:12px}.top{margin-top:4px;align-items:flex-start}.stats{gap:5px}.pill{padding:7px 9px;font-size:12px}.card{border-radius:24px;padding:20px 16px}.modes{grid-template-columns:1fr}.mode{display:grid;grid-template-columns:52px 1fr;text-align:left;align-items:center;padding:14px 16px}.mode-icon{grid-row:1/3;margin:0;font-size:38px}.mode strong,.mode small{grid-column:2}.visual{height:155px}.flag{max-height:145px}.logo-img{height:125px}.big-emoji{font-size:92px}.answer{padding:14px;font-size:17px}.feedback{font-size:16px}.brand{font-size:20px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div class="brand"><span class="globe">🌎</span><span>World Explorer</span></div>
      <div class="stats" id="stats">
        <div class="pill hidden" id="playerPill">👤 <span id="playerNameTop"></span></div>
        <div class="pill">✅ <span id="correctCount">0</span></div>
        <div class="pill">❌ <span id="wrongCount">0</span></div>
        <div class="pill">🔥 <span id="streak">0</span></div>
      </div>
    </div>
    <section class="card" id="card">
      <div class="progress"><div id="progress"></div></div>
      <div id="welcome">
        <div style="font-size:78px;margin:6px 0 8px">🎮</div>
        <div class="eyebrow">Choose your challenge</div>
        <h1>Welcome to World Explorer!</h1>
        <p class="sub">Enter your name, then pick a game.</p>
        <div class="name-wrap">
          <label for="playerName">Player name</label>
          <input class="name-input" id="playerName" maxlength="24" placeholder="Type your name" autocomplete="off" />
        </div>
        <div class="modes">
          <button class="mode" data-mode="world"><span class="mode-icon">🌍</span><strong>Option A · Flags & Countries</strong><small>Flags, countries, capitals and surprise U.S. state capitals</small></button>
          <button class="mode" data-mode="logos"><span class="mode-icon">💡</span><strong>Option B · Guess the Logo</strong><small>Look at the famous logo and choose the brand</small></button>
          <button class="mode" data-mode="food"><span class="mode-icon">🍕</span><strong>Option C · Guess the Food</strong><small>Look at the food and choose the correct name</small></button>
        </div>
        <div class="mini" id="menuMessage">Tap any game to begin · works on phone, tablet and computer</div>
      </div>
      <div id="game" class="hidden">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="question"></h1>
        <p class="sub" id="hint"></p>
        <div class="visual" id="visual"><img id="visualImg" class="flag hidden" alt="Quiz image" /><div id="visualEmoji" class="big-emoji hidden"></div></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <button class="menu-btn" id="menuBtn">← Change game</button>
      </div>
    </section>
  </main>
<script>
const countries=[
['Argentina','Buenos Aires','ar'],['Australia','Canberra','au'],['Austria','Vienna','at'],['Belgium','Brussels','be'],['Brazil','Brasília','br'],['Canada','Ottawa','ca'],['Chile','Santiago','cl'],['China','Beijing','cn'],['Colombia','Bogotá','co'],['Costa Rica','San José','cr'],['Croatia','Zagreb','hr'],['Cuba','Havana','cu'],['Czechia','Prague','cz'],['Denmark','Copenhagen','dk'],['Dominican Republic','Santo Domingo','do'],['Ecuador','Quito','ec'],['Egypt','Cairo','eg'],['Finland','Helsinki','fi'],['France','Paris','fr'],['Germany','Berlin','de'],['Greece','Athens','gr'],['Hungary','Budapest','hu'],['Iceland','Reykjavík','is'],['India','New Delhi','in'],['Indonesia','Jakarta','id'],['Ireland','Dublin','ie'],['Israel','Jerusalem','il'],['Italy','Rome','it'],['Japan','Tokyo','jp'],['Jordan','Amman','jo'],['Kenya','Nairobi','ke'],['Mexico','Mexico City','mx'],['Morocco','Rabat','ma'],['Netherlands','Amsterdam','nl'],['New Zealand','Wellington','nz'],['Nigeria','Abuja','ng'],['Norway','Oslo','no'],['Panama','Panama City','pa'],['Peru','Lima','pe'],['Philippines','Manila','ph'],['Poland','Warsaw','pl'],['Portugal','Lisbon','pt'],['Romania','Bucharest','ro'],['Saudi Arabia','Riyadh','sa'],['Singapore','Singapore','sg'],['South Africa','Pretoria','za'],['South Korea','Seoul','kr'],['Spain','Madrid','es'],['Sweden','Stockholm','se'],['Switzerland','Bern','ch'],['Thailand','Bangkok','th'],['Turkey','Ankara','tr'],['Ukraine','Kyiv','ua'],['United Arab Emirates','Abu Dhabi','ae'],['United Kingdom','London','gb'],['United States','Washington, D.C.','us'],['Uruguay','Montevideo','uy'],['Vietnam','Hanoi','vn']
].map(([country,capital,code])=>({country,capital,code}));
const states=[['Alabama','Montgomery'],['Alaska','Juneau'],['Arizona','Phoenix'],['Arkansas','Little Rock'],['California','Sacramento'],['Colorado','Denver'],['Connecticut','Hartford'],['Delaware','Dover'],['Florida','Tallahassee'],['Georgia','Atlanta'],['Hawaii','Honolulu'],['Idaho','Boise'],['Illinois','Springfield'],['Indiana','Indianapolis'],['Iowa','Des Moines'],['Kansas','Topeka'],['Kentucky','Frankfort'],['Louisiana','Baton Rouge'],['Maine','Augusta'],['Maryland','Annapolis'],['Massachusetts','Boston'],['Michigan','Lansing'],['Minnesota','Saint Paul'],['Mississippi','Jackson'],['Missouri','Jefferson City'],['Montana','Helena'],['Nebraska','Lincoln'],['Nevada','Carson City'],['New Hampshire','Concord'],['New Jersey','Trenton'],['New Mexico','Santa Fe'],['New York','Albany'],['North Carolina','Raleigh'],['North Dakota','Bismarck'],['Ohio','Columbus'],['Oklahoma','Oklahoma City'],['Oregon','Salem'],['Pennsylvania','Harrisburg'],['Rhode Island','Providence'],['South Carolina','Columbia'],['South Dakota','Pierre'],['Tennessee','Nashville'],['Texas','Austin'],['Utah','Salt Lake City'],['Vermont','Montpelier'],['Virginia','Richmond'],['Washington','Olympia'],['West Virginia','Charleston'],['Wisconsin','Madison'],['Wyoming','Cheyenne']].map(([state,capital])=>({state,capital}));
const logos=[
['Apple','apple'],['Google','google'],['Nike','nike'],['Adidas','adidas'],['McDonald’s','mcdonalds'],['YouTube','youtube'],['Netflix','netflix'],['Amazon','amazon'],['Microsoft','microsoft'],['Spotify','spotify'],['Instagram','instagram'],['TikTok','tiktok'],['PlayStation','playstation'],['Xbox','xbox'],['Lego','lego'],['Reddit','reddit'],['Discord','discord'],['Tesla','tesla'],['Starbucks','starbucks'],['Airbnb','airbnb']
].map(([name,slug])=>({name,slug}));
const foods=[
['Pizza','🍕'],['Hamburger','🍔'],['French Fries','🍟'],['Hot Dog','🌭'],['Taco','🌮'],['Burrito','🌯'],['Sushi','🍣'],['Spaghetti','🍝'],['Pancakes','🥞'],['Waffle','🧇'],['Donut','🍩'],['Cookie','🍪'],['Cake','🍰'],['Ice Cream','🍦'],['Popcorn','🍿'],['Pretzel','🥨'],['Croissant','🥐'],['Cheese','🧀'],['Avocado','🥑'],['Watermelon','🍉'],['Strawberry','🍓'],['Pineapple','🍍'],['Banana','🍌'],['Apple','🍎'],['Carrot','🥕'],['Corn','🌽'],['Broccoli','🥦'],['Egg','🥚'],['Bacon','🥓'],['Shrimp','🍤']
].map(([name,emoji])=>({name,emoji}));
const $=id=>document.getElementById(id);
let correctCount=0,wrongCount=0,streak=0,round=0,current=null,phase='flag',answered=false,lastCountry=-1,lastLogo=-1,lastFood=-1,mode='world',advanceTimer=null;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function sampleWrong(items,correct,key){return shuffle(items.filter(x=>x[key]!==correct)).slice(0,2).map(x=>x[key])}
function resetScore(){correctCount=0;wrongCount=0;streak=0;round=0;$('correctCount').textContent='0';$('wrongCount').textContent='0';$('streak').textContent='0';$('progress').style.width='0'}
function showImage(src,kind='flag'){const img=$('visualImg');const emoji=$('visualEmoji');emoji.classList.add('hidden');img.className=kind==='logo'?'logo-img':'flag';img.src=src;img.classList.remove('hidden')}
function showEmoji(value){const img=$('visualImg');const emoji=$('visualEmoji');img.classList.add('hidden');emoji.textContent=value;emoji.classList.remove('hidden')}
function setAnswers(values,correct){answered=false;$('feedback').textContent='';$('feedback').className='feedback';$('answers').innerHTML='';shuffle(values).forEach((text,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${text}</span>`;b.addEventListener('click',()=>choose(b,text,correct));$('answers').appendChild(b)})}
function bumpRound(){round++;$('progress').style.width=((round%10)||10)*10+'%'}
function newCountry(){let i;do{i=Math.floor(Math.random()*countries.length)}while(i===lastCountry);lastCountry=i;current=countries[i];phase='flag';renderCountryFlag()}
function renderCountryFlag(){bumpRound();$('eyebrow').textContent='🌍 Flag challenge';$('question').textContent='Which country has this flag?';$('hint').textContent='Look carefully, then choose one answer.';showImage(`https://flagcdn.com/w320/${current.code}.png`);setAnswers([current.country,...sampleWrong(countries,current.country,'country')],current.country)}
function renderCapital(){bumpRound();$('eyebrow').textContent='🏛️ Capital challenge';$('question').textContent=`What is the capital of ${current.country}?`;$('hint').textContent='Same country — now test the capital!';showImage(`https://flagcdn.com/w320/${current.code}.png`);setAnswers([current.capital,...sampleWrong(countries,current.capital,'capital')],current.capital)}
function renderState(){bumpRound();const s=states[Math.floor(Math.random()*states.length)];current=s;phase='state';$('eyebrow').textContent='🇺🇸 Surprise U.S. challenge';$('question').textContent=`What is the capital of ${s.state}?`;$('hint').textContent='No flag this time — it’s an American state capital.';showEmoji('🇺🇸');setAnswers([s.capital,...sampleWrong(states,s.capital,'capital')],s.capital)}
function renderLogo(){bumpRound();let i;do{i=Math.floor(Math.random()*logos.length)}while(i===lastLogo);lastLogo=i;current=logos[i];phase='logo';$('eyebrow').textContent='💡 Logo challenge';$('question').textContent='Which brand has this logo?';$('hint').textContent='Pick the correct brand name.';showImage(`https://cdn.simpleicons.org/${current.slug}`,'logo');setAnswers([current.name,...sampleWrong(logos,current.name,'name')],current.name)}
function renderFood(){bumpRound();let i;do{i=Math.floor(Math.random()*foods.length)}while(i===lastFood);lastFood=i;current=foods[i];phase='food';$('eyebrow').textContent='🍽️ Food challenge';$('question').textContent='What food is this?';$('hint').textContent='Look at the picture and choose the name.';showEmoji(current.emoji);setAnswers([current.name,...sampleWrong(foods,current.name,'name')],current.name)}
function nextQuestion(){if(mode==='world'){if(phase==='flag'){phase='capital';renderCapital()}else if(phase==='capital'){Math.random()<.22?renderState():newCountry()}else{newCountry()}}else if(mode==='logos'){renderLogo()}else{renderFood()}}
function choose(btn,picked,correct){if(answered)return;answered=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;const txt=b.querySelector('span:last-child').textContent;if(txt===correct)b.classList.add('correct')});if(picked===correct){correctCount++;streak++;btn.classList.add('correct');$('feedback').textContent=streak>=3?`✅ Correct! ${streak} in a row! 🔥`:'✅ Correct! Great job!';$('feedback').classList.add('ok');celebrate()}else{wrongCount++;streak=0;btn.classList.add('wrong');$('feedback').textContent=`❌ Not quite. The answer is ${correct}.`;$('feedback').classList.add('no')}$('correctCount').textContent=correctCount;$('wrongCount').textContent=wrongCount;$('streak').textContent=streak;clearTimeout(advanceTimer);advanceTimer=setTimeout(nextQuestion,1150)}
function celebrate(){const icons=['⭐','✨','🎉','🌟'];for(let i=0;i<7;i++){const s=document.createElement('span');s.className='spark';s.textContent=icons[Math.floor(Math.random()*icons.length)];s.style.left=(18+Math.random()*64)+'%';s.style.bottom='80px';s.style.setProperty('--x',(Math.random()*160-80)+'px');s.style.setProperty('--r',(Math.random()*180-90)+'deg');$('card').appendChild(s);setTimeout(()=>s.remove(),900)}}
function startGame(selectedMode){const name=$('playerName').value.trim();if(!name){$('menuMessage').textContent='Please enter your player name first 🙂';$('playerName').focus();return}mode=selectedMode;resetScore();$('playerNameTop').textContent=name;$('playerPill').classList.remove('hidden');$('welcome').classList.add('hidden');$('game').classList.remove('hidden');if(mode==='world')newCountry();else if(mode==='logos')renderLogo();else renderFood()}
document.querySelectorAll('.mode').forEach(btn=>btn.addEventListener('click',()=>startGame(btn.dataset.mode)));
$('playerName').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('.mode').focus()});
$('menuBtn').addEventListener('click',()=>{clearTimeout(advanceTimer);$('game').classList.add('hidden');$('welcome').classList.remove('hidden');$('progress').style.width='0';$('menuMessage').textContent='Tap any game to begin · works on phone, tablet and computer'});
</script>
</body>
</html>
