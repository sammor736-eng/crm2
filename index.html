<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Explorer Quiz</title><style>:root{--ink:#17324d;--muted:#6a7f95;--blue:#1e73d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eef7ff,#fff8df);display:flex;justify-content:center;padding:14px}.app{width:min(820px,100%)}.top{display:flex;justify-content:center;align-items:center;margin:5px 0 10px}.brand{font-size:24px;font-weight:900}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.scorebar{margin-top:6px;padding-top:9px;border-top:1px solid #dce8f3}.pill{background:#fff;border:1px solid #dce8f3;border-radius:999px;padding:7px 10px;font-weight:800;font-size:12px}.pill.active{outline:3px solid #d8ebff;background:#eef7ff}.card{background:#fffffff5;border-radius:28px;padding:clamp(16px,4vw,32px);text-align:center;box-shadow:0 18px 50px #22487024}.progress{height:7px;background:#e9f0f6;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress div{height:100%;background:linear-gradient(90deg,#3b8ff0,#45c67b);transition:.3s}.eyebrow,.section-label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:900;color:var(--blue);margin:8px 0}.sub{color:var(--muted);font-weight:650;margin:6px 0 10px}.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:14px 0}.choice{border:2px solid #dfe9f2;background:white;border-radius:15px;padding:11px 16px;font-size:16px;font-weight:900;cursor:pointer}.choice.selected{border-color:#4b9aea;background:#eef7ff}.names{max-width:500px;margin:14px auto;display:grid;gap:9px}.name-row{text-align:left}.name-row label{display:block;font-size:13px;font-weight:900;margin-bottom:5px}.name-input{width:100%;border:2px solid #dfe9f2;border-radius:14px;padding:12px 14px;font-size:17px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.mode{border:2px solid #dfe9f2;background:#fff;border-radius:19px;padding:15px 10px;cursor:pointer;color:var(--ink);font:inherit}.mode-icon{display:block;font-size:38px}.mode strong{display:block;font-size:16px}.mode small{display:block;color:var(--muted);font-weight:650;margin-top:4px}.turn-banner{display:block;width:fit-content;max-width:100%;margin:0 auto 7px;background:#e9f5ff;border:2px solid #78b7f1;color:#104f91;border-radius:17px;padding:8px 16px;font-size:clamp(18px,4.5vw,24px);font-weight:950}.question{font-size:clamp(25px,5.7vw,38px);line-height:1.08;margin:3px 0 5px}.visual{height:135px;display:flex;align-items:center;justify-content:center;margin:2px 0 12px}.flag{max-width:min(300px,80vw);max-height:130px;border-radius:14px;box-shadow:0 8px 22px #0002}.emoji{font-size:88px}.answers{display:grid;gap:8px;text-align:left}.answer{width:100%;border:2px solid #dfe9f2;background:#fff;border-radius:15px;padding:12px 14px;font-size:17px;font-weight:800;cursor:pointer}.answer.correct{border-color:#58c996;background:#ecfbf4}.answer.wrong{border-color:#f28f8f;background:#fff0f0}.feedback{min-height:38px;margin-top:8px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center}.menu{border:0;background:transparent;color:#61768d;font-weight:850;padding:7px 10px}.hidden{display:none!important}.mini{font-size:12px;color:#8293a5;margin-top:14px}@media(max-width:620px){body{padding:8px}.top{margin:2px 0 6px}.brand{font-size:18px}.card{padding:10px 10px 9px;border-radius:20px}.progress{height:5px;margin-bottom:7px}.turn-banner{margin-bottom:5px;padding:6px 12px;font-size:17px;border-radius:14px}.eyebrow{font-size:10px;margin:4px 0}.question{font-size:clamp(21px,5.7vw,27px);margin:2px 0 3px}.sub{font-size:12px;margin:3px 0 5px}.visual{height:92px;margin:0 0 6px}.flag{max-height:90px;max-width:min(245px,76vw)}.emoji{font-size:64px}.answers{gap:6px}.answer{padding:9px 11px;font-size:15px;border-radius:12px}.feedback{min-height:30px;margin-top:5px;font-size:14px}.menu{padding:5px;font-size:12px}.scorebar{margin-top:2px;padding-top:6px}.pill{padding:5px 7px;font-size:11px}.modes{grid-template-columns:1fr 1fr}.mode{padding:12px 8px}.mode-icon{font-size:32px}.mode strong{font-size:14px}.mode small{font-size:11px}}</style></head><body><main class="app"><div class="top"><div class="brand">🌎 World Explorer</div></div><section class="card"><div class="progress"><div id="progress"></div></div><div id="welcome"><div style="font-size:65px">🎮</div><div class="eyebrow">Choose your challenge</div><h1>Welcome to World Explorer!</h1><p class="sub">Choose players, names, difficulty, then pick a category.</p><div class="row"><button id="one" class="choice selected">👤 1 Player</button><button id="two" class="choice">👥 2 Players</button></div><div class="names"><div class="name-row"><label>Player 1 name</label><input id="p1" class="name-input" maxlength="24" placeholder="Type name"></div><div id="p2row" class="name-row hidden"><label>Player 2 name</label><input id="p2" class="name-input" maxlength="24" placeholder="Type second name"></div></div><div class="section-label">Choose difficulty</div><div class="row"><button class="choice selected" data-level="easy">🟢 Easy</button><button class="choice" data-level="medium">🟡 Medium</button><button class="choice" data-level="hard">🔴 Hard</button></div><div class="section-label">Choose category</div><div class="modes"><button class="mode" data-mode="world"><span class="mode-icon">🌍</span><strong>Flags & Countries</strong><small>Flags, capitals & states</small></button><button class="mode" data-mode="food"><span class="mode-icon">🍕</span><strong>Food</strong><small>Foods from around the world</small></button><button class="mode" data-mode="logos"><span class="mode-icon">💡</span><strong>Logos</strong><small>Famous brands</small></button><button class="mode" data-mode="animals"><span class="mode-icon">🐾</span><strong>Animals</strong><small>Animals & habitats</small></button><button class="mode" data-mode="space"><span class="mode-icon">🚀</span><strong>Space</strong><small>Planets & astronomy</small></button><button class="mode" data-mode="dinos"><span class="mode-icon">🦖</span><strong>Dinosaurs</strong><small>Prehistoric fun</small></button><button class="mode" data-mode="landmarks"><span class="mode-icon">🗽</span><strong>Landmarks</strong><small>Famous places</small></button><button class="mode" data-mode="math"><span class="mode-icon">➕</span><strong>Math</strong><small>Age-friendly math</small></button><button class="mode" data-mode="mixed"><span class="mode-icon">🎲</span><strong>Mixed Challenge</strong><small>Surprise me!</small></button></div><div id="msg" class="mini">In 2-player mode, players alternate every question.</div></div><div id="game" class="hidden"><div id="turn" class="turn-banner"></div><div id="eyebrow" class="eyebrow"></div><h1 id="question" class="question"></h1><p id="hint" class="sub"></p><div class="visual"><img id="img" class="flag hidden" alt="Quiz image"><div id="emoji" class="emoji"></div></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="menu" class="menu">← Change game</button><div id="stats" class="stats scorebar"></div></div></section></main><script>const $=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);let pc=1,players=[],active=0,level='easy',mode='',round=0,answered=false,timer,currentCountry=null,worldPhase='flag';const countries=[['United States','Washington, D.C.','us',1],['Canada','Ottawa','ca',1],['Mexico','Mexico City','mx',1],['United Kingdom','London','gb',1],['France','Paris','fr',1],['Germany','Berlin','de',1],['Italy','Rome','it',1],['Spain','Madrid','es',1],['Japan','Tokyo','jp',1],['China','Beijing','cn',1],['India','New Delhi','in',1],['Israel','Jerusalem','il',1],['Brazil','Brasília','br',1],['Australia','Canberra','au',1],['Argentina','Buenos Aires','ar',2],['Greece','Athens','gr',2],['Ireland','Dublin','ie',2],['Portugal','Lisbon','pt',2],['Netherlands','Amsterdam','nl',2],['Sweden','Stockholm','se',2],['Norway','Oslo','no',2],['Denmark','Copenhagen','dk',2],['Poland','Warsaw','pl',2],['South Korea','Seoul','kr',2],['Thailand','Bangkok','th',2],['Egypt','Cairo','eg',2],['Chile','Santiago','cl',2],['Peru','Lima','pe',2],['Finland','Helsinki','fi',3],['Iceland','Reykjavík','is',3],['Hungary','Budapest','hu',3],['Romania','Bucharest','ro',3],['Croatia','Zagreb','hr',3],['Czechia','Prague','cz',3],['Kenya','Nairobi','ke',3],['Nigeria','Abuja','ng',3],['Morocco','Rabat','ma',3],['Uruguay','Montevideo','uy',3]].map(x=>({country:x[0],capital:x[1],code:x[2],tier:x[3]}));const qa={animals:[['Which animal says “moo”?','Cow',['Lion','Duck'],1,'🐄'],['Which animal is the largest land animal?','Elephant',['Dog','Rabbit'],1,'🐘'],['Which animal has a very long neck?','Giraffe',['Tiger','Bear'],1,'🦒'],['Which animal lives in the Arctic?','Polar bear',['Camel','Gorilla'],2,'🐻‍❄️'],['Which mammal can truly fly?','Bat',['Penguin','Ostrich'],2,'🦇'],['What is the fastest land animal?','Cheetah',['Lion','Horse'],3,'🐆'],['Which animal is known for changing color?','Chameleon',['Zebra','Panda'],3,'🦎']],space:[['Which planet do we live on?','Earth',['Mars','Jupiter'],1,'🌍'],['What gives Earth light during the day?','The Sun',['The Moon','Saturn'],1,'☀️'],['Which planet is called the Red Planet?','Mars',['Venus','Neptune'],2,'🔴'],['Which is the largest planet?','Jupiter',['Mercury','Earth'],2,'🪐'],['Which planet is closest to the Sun?','Mercury',['Mars','Saturn'],3,'☀️'],['What galaxy is Earth in?','Milky Way',['Andromeda','Sombrero'],3,'🌌']],dinos:[['Which dinosaur had three horns?','Triceratops',['T. rex','Stegosaurus'],1,'🦕'],['Which famous dinosaur had huge teeth and tiny arms?','T. rex',['Brachiosaurus','Triceratops'],1,'🦖'],['Which dinosaur had plates along its back?','Stegosaurus',['Velociraptor','T. rex'],2,'🦕'],['Which dinosaur had a very long neck?','Brachiosaurus',['Ankylosaurus','Triceratops'],2,'🦕'],['Which dinosaur name means “swift thief”?','Velociraptor',['Stegosaurus','Diplodocus'],3,'🦖']],landmarks:[['Where is the Statue of Liberty?','New York City',['Paris','Rome'],1,'🗽'],['Where is the Eiffel Tower?','Paris',['London','Tokyo'],1,'🗼'],['The Great Pyramids are in which country?','Egypt',['Canada','Brazil'],1,'🔺'],['Big Ben is in which city?','London',['Madrid','Berlin'],2,'🕰️'],['The Colosseum is in which city?','Rome',['Athens','Dublin'],2,'🏛️'],['Machu Picchu is in which country?','Peru',['India','Italy'],3,'⛰️'],['Petra is in which country?','Jordan',['Japan','Mexico'],3,'🏜️']],logos:[['Which company makes the iPhone?','Apple',['Nike','Netflix'],1,'📱'],['Which brand uses a swoosh logo?','Nike',['Lego','Amazon'],1,'👟'],['Which company is famous for its search engine?','Google',['Adidas','Tesla'],1,'🔎'],['Which service is known for streaming movies and shows?','Netflix',['Nike','Lego'],2,'🎬'],['Which company makes Xbox?','Microsoft',['Apple','Spotify'],3,'🎮']],food:[['Which food is this?','Pizza',['Taco','Sushi'],1,'🍕'],['Which food is this?','Hamburger',['Pancake','Pretzel'],1,'🍔'],['Which food is this?','Sushi',['Donut','Hot Dog'],2,'🍣'],['Which food is this?','Croissant',['Taco','Waffle'],2,'🥐'],['Which food is this?','Avocado',['Broccoli','Pear'],3,'🥑']]};function tier(){return level==='easy'?1:level==='medium'?2:3}function stats(){let s=$('stats');s.innerHTML='';players.forEach((p,i)=>{let d=document.createElement('div');d.className='pill'+(i===active?' active':'');d.textContent=(i===active?'👉 ':'')+p.name+' ✅'+p.correct+' ❌'+p.wrong;s.appendChild(d)});if(players.length)$('turn').textContent=pc===2?'🎯 '+players[active].name+' — YOUR TURN!':'🎯 '+players[0].name}function setPC(n){pc=n;$('one').classList.toggle('selected',n===1);$('two').classList.toggle('selected',n===2);$('p2row').classList.toggle('hidden',n===1)}$('one').onclick=()=>setPC(1);$('two').onclick=()=>setPC(2);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('selected',x===b))});function visual(v,isImg=false){$('img').classList.toggle('hidden',!isImg);$('emoji').classList.toggle('hidden',isImg);if(isImg)$('img').src=v;else $('emoji').textContent=v}function ask(cat){round++;$('progress').style.width=((round%10)||10)*10+'%';if(cat==='math')return askMath();if(cat==='world')return askWorld();let pool=(qa[cat]||qa.animals).filter(q=>q[3]<=tier()),q=pool[Math.floor(Math.random()*pool.length)];render(cat,q[0],q[1],[q[1],...q[2]],q[4])}function render(cat,q,correct,opts,v){answered=false;$('eyebrow').textContent=({animals:'🐾 Animals',space:'🚀 Space',dinos:'🦖 Dinosaurs',landmarks:'🗽 Landmarks',math:'➕ Math',logos:'💡 Logos',food:'🍕 Food',world:'🌍 Geography',mixed:'🎲 Mixed'}[cat]||'🎲 Challenge')+' · '+level.toUpperCase();$('question').textContent=q;$('hint').textContent='Choose the best answer.';visual(v||'❓');$('feedback').textContent='';$('answers').innerHTML='';stats();shuffle(opts).forEach((x,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'.  '+x;b.onclick=()=>choose(b,x,correct);$('answers').appendChild(b)})}function askMath(){let t=tier(),a,b,op,ans;if(t===1){a=1+Math.floor(Math.random()*10);b=1+Math.floor(Math.random()*9);op='+';ans=a+b}else if(t===2){a=2+Math.floor(Math.random()*11);b=2+Math.floor(Math.random()*10);op='×';ans=a*b}else{b=2+Math.floor(Math.random()*10);ans=2+Math.floor(Math.random()*12);a=b*ans;op='÷'}let opts=[String(ans),String(ans+(t===1?1:b)),String(Math.max(0,ans-(t===1?1:2)))];render('math',`What is ${a} ${op} ${b}?`,String(ans),opts,'🧮')}function askWorld(){let pool=countries.filter(c=>c.tier<=tier());if(!currentCountry||worldPhase==='new'){currentCountry=pool[Math.floor(Math.random()*pool.length)];worldPhase='flag'}let c=currentCountry;if(worldPhase==='flag'){let wrong=shuffle(pool.filter(x=>x.country!==c.country)).slice(0,2).map(x=>x.country);answered=false;$('eyebrow').textContent='🌍 FLAG · '+level.toUpperCase();$('question').textContent='Which country has this flag?';$('hint').textContent='Look carefully and choose.';visual('https://flagcdn.com/w320/'+c.code+'.png',true);$('feedback').textContent='';$('answers').innerHTML='';stats();shuffle([c.country,...wrong]).forEach((x,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'.  '+x;b.onclick=()=>choose(b,x,c.country);$('answers').appendChild(b)});worldPhase='capital'}else{let wrong=shuffle(pool.filter(x=>x.capital!==c.capital)).slice(0,2).map(x=>x.capital);render('world','What is the capital of '+c.country+'?',c.capital,[c.capital,...wrong],'🏛️');worldPhase='new'}}function choose(btn,picked,correct){if(answered)return;answered=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent.includes(correct))b.classList.add('correct')});let p=players[active];if(picked===correct){p.correct++;btn.classList.add('correct');$('feedback').textContent='✅ Correct, '+p.name+'!';$('feedback').style.color='#16875b'}else{p.wrong++;btn.classList.add('wrong');$('feedback').textContent='❌ '+p.name+', the answer is '+correct+'.';$('feedback').style.color='#c13f3f'}stats();clearTimeout(timer);timer=setTimeout(next,1300)}function next(){if(pc===2)active=1-active;if(mode==='mixed'){let cats=['world','food','logos','animals','space','dinos','landmarks','math'];ask(cats[Math.floor(Math.random()*cats.length)])}else ask(mode)}function start(m){let a=$('p1').value.trim(),b=$('p2').value.trim();if(!a){$('msg').textContent='Please enter Player 1 name 🙂';return}if(pc===2&&!b){$('msg').textContent='Please enter Player 2 name 🙂';return}players=[{name:a,correct:0,wrong:0}];if(pc===2)players.push({name:b,correct:0,wrong:0});active=0;round=0;mode=m;worldPhase='new';$('welcome').classList.add('hidden');$('game').classList.remove('hidden');next()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('menu').onclick=()=>{clearTimeout(timer);$('game').classList.add('hidden');$('welcome').classList.remove('hidden');$('stats').innerHTML='';$('progress').style.width='0'};</script></body></html>
