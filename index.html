<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Explorer Quiz</title><style>:root{--ink:#17324d;--muted:#6a7f95;--blue:#1e73d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eef7ff,#fff8df);display:flex;justify-content:center;padding:8px}.app{width:min(820px,100%)}.top{text-align:center;margin:3px 0 7px}.brand{font-size:20px;font-weight:950}.card{background:#fffffff5;border-radius:24px;padding:clamp(11px,3vw,26px);text-align:center;box-shadow:0 18px 50px #22487024}.progress{height:6px;background:#e9f0f6;border-radius:99px;overflow:hidden;margin-bottom:9px}.progress div{height:100%;background:linear-gradient(90deg,#3b8ff0,#45c67b)}.eyebrow,.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:900;color:var(--blue);margin:6px 0}.sub{color:var(--muted);font-weight:650;margin:4px 0 7px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.choice{border:2px solid #dfe9f2;background:white;border-radius:14px;padding:9px 14px;font-size:15px;font-weight:900}.choice.selected{border-color:#4b9aea;background:#eef7ff}.names{max-width:500px;margin:10px auto;display:grid;gap:7px}.name-row{text-align:left}.name-row label{display:block;font-size:12px;font-weight:900;margin-bottom:3px}.name-input{width:100%;border:2px solid #dfe9f2;border-radius:13px;padding:10px 12px;font-size:16px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mode{border:2px solid #dfe9f2;background:#fff;border-radius:17px;padding:11px 7px;color:var(--ink)}.mode-icon{display:block;font-size:30px}.mode strong{display:block;font-size:14px}.mode small{display:block;color:var(--muted);font-weight:650;font-size:11px}.turn-banner{width:fit-content;max-width:100%;margin:0 auto 4px;background:#e9f5ff;border:2px solid #78b7f1;color:#104f91;border-radius:15px;padding:6px 12px;font-size:clamp(17px,4vw,22px);font-weight:950}.question{font-size:clamp(21px,5vw,34px);line-height:1.08;margin:2px 0 3px}.visual{height:100px;display:flex;align-items:center;justify-content:center;margin:0 0 6px}.flag{max-width:min(260px,75vw);max-height:96px;border-radius:12px;box-shadow:0 7px 18px #0002}.emoji{font-size:67px}.answers{display:grid;gap:6px;text-align:left}.answer{width:100%;border:2px solid #dfe9f2;background:#fff;border-radius:13px;padding:9px 11px;font-size:15px;font-weight:800}.answer.correct{border-color:#58c996;background:#ecfbf4}.answer.wrong{border-color:#f28f8f;background:#fff0f0}.feedback{min-height:28px;margin-top:4px;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px;padding-top:6px;border-top:1px solid #dce8f3}.pill{background:#fff;border:1px solid #dce8f3;border-radius:999px;padding:5px 8px;font-weight:850;font-size:11px}.pill.active{outline:2px solid #d8ebff;background:#eef7ff}.menu{border:0;background:transparent;color:#61768d;font-weight:850;padding:5px}.hidden{display:none!important}.mini{font-size:12px;color:#8293a5;margin-top:10px}@media(max-width:620px){.modes{grid-template-columns:1fr 1fr}.card{padding:9px}.top{margin:1px 0 4px}.brand{font-size:17px}.progress{margin-bottom:5px}.turn-banner{font-size:16px;padding:5px 10px}.eyebrow{font-size:9px;margin:3px}.question{font-size:21px}.sub{font-size:11px;margin:2px 0 4px}.visual{height:78px}.flag{max-height:76px}.emoji{font-size:55px}.answer{padding:8px 9px;font-size:14px}.feedback{min-height:24px;font-size:13px}.mode{padding:9px 6px}.mode-icon{font-size:27px}}</style></head><body><main class="app"><div class="top"><div class="brand">🌎 World Explorer</div></div><section class="card"><div class="progress"><div id="progress"></div></div><div id="welcome"><div style="font-size:48px">🎮</div><div class="eyebrow">Choose your challenge</div><h1 style="margin:4px">World Explorer!</h1><p class="sub">Choose players, names, difficulty, then a category.</p><div class="row"><button id="one" class="choice selected">👤 1 Player</button><button id="two" class="choice">👥 2 Players</button></div><div class="names"><div class="name-row"><label>Player 1 name</label><input id="p1" class="name-input" maxlength="24" placeholder="Type name"></div><div id="p2row" class="name-row hidden"><label>Player 2 name</label><input id="p2" class="name-input" maxlength="24" placeholder="Type second name"></div></div><div class="section-label">Difficulty</div><div class="row"><button class="choice selected" data-level="easy">🟢 Easy</button><button class="choice" data-level="medium">🟡 Medium</button><button class="choice" data-level="hard">🔴 Hard</button></div><div class="section-label">Category</div><div class="modes"><button class="mode" data-mode="world"><span class="mode-icon">🌍</span><strong>Flags & Countries</strong><small>Flags & capitals</small></button><button class="mode" data-mode="food"><span class="mode-icon">🍕</span><strong>Food</strong><small>50+ questions</small></button><button class="mode" data-mode="logos"><span class="mode-icon">💡</span><strong>Logos</strong><small>50+ questions</small></button><button class="mode" data-mode="animals"><span class="mode-icon">🐾</span><strong>Animals</strong><small>50+ questions</small></button><button class="mode" data-mode="space"><span class="mode-icon">🚀</span><strong>Space</strong><small>50+ questions</small></button><button class="mode" data-mode="dinos"><span class="mode-icon">🦖</span><strong>Dinosaurs</strong><small>50+ questions</small></button><button class="mode" data-mode="landmarks"><span class="mode-icon">🗽</span><strong>Landmarks</strong><small>50+ questions</small></button><button class="mode" data-mode="math"><span class="mode-icon">➕</span><strong>Math</strong><small>50+ unique problems</small></button><button class="mode" data-mode="mixed"><span class="mode-icon">🎲</span><strong>Mixed Challenge</strong><small>All categories</small></button></div><div id="msg" class="mini">Questions do not repeat during the same game.</div></div><div id="game" class="hidden"><div id="turn" class="turn-banner"></div><div id="eyebrow" class="eyebrow"></div><h1 id="question" class="question"></h1><p id="hint" class="sub"></p><div class="visual"><img id="img" class="flag hidden" alt="Quiz image"><div id="emoji" class="emoji"></div></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="menu" class="menu">← Change game</button><div id="stats" class="stats"></div></div></section></main><script src="question-bank.js"></script><script>const $=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);let pc=1,players=[],active=0,level='easy',mode='',round=0,answered=false,timer,used=new Set(),currentCountry=null,worldPhase='new',mathUsed=new Set();const countries=[['United States','Washington, D.C.','us',1],['Canada','Ottawa','ca',1],['Mexico','Mexico City','mx',1],['United Kingdom','London','gb',1],['France','Paris','fr',1],['Germany','Berlin','de',1],['Italy','Rome','it',1],['Spain','Madrid','es',1],['Japan','Tokyo','jp',1],['China','Beijing','cn',1],['India','New Delhi','in',1],['Israel','Jerusalem','il',1],['Brazil','Brasília','br',1],['Australia','Canberra','au',1],['Argentina','Buenos Aires','ar',2],['Greece','Athens','gr',2],['Ireland','Dublin','ie',2],['Portugal','Lisbon','pt',2],['Netherlands','Amsterdam','nl',2],['Sweden','Stockholm','se',2],['Norway','Oslo','no',2],['Denmark','Copenhagen','dk',2],['Poland','Warsaw','pl',2],['South Korea','Seoul','kr',2],['Thailand','Bangkok','th',2],['Egypt','Cairo','eg',2],['Chile','Santiago','cl',2],['Peru','Lima','pe',2],['Austria','Vienna','at',2],['Belgium','Brussels','be',2],['Switzerland','Bern','ch',2],['New Zealand','Wellington','nz',2],['Turkey','Ankara','tr',2],['Saudi Arabia','Riyadh','sa',2],['United Arab Emirates','Abu Dhabi','ae',2],['Finland','Helsinki','fi',3],['Iceland','Reykjavík','is',3],['Hungary','Budapest','hu',3],['Romania','Bucharest','ro',3],['Croatia','Zagreb','hr',3],['Czechia','Prague','cz',3],['Kenya','Nairobi','ke',3],['Nigeria','Abuja','ng',3],['Morocco','Rabat','ma',3],['Uruguay','Montevideo','uy',3],['Vietnam','Hanoi','vn',3],['Indonesia','Jakarta','id',3],['Philippines','Manila','ph',3],['Singapore','Singapore','sg',3],['South Africa','Pretoria','za',3],['Colombia','Bogotá','co',3],['Ecuador','Quito','ec',3],['Panama','Panama City','pa',3],['Costa Rica','San José','cr',3],['Cuba','Havana','cu',3],['Dominican Republic','Santo Domingo','do',3],['Jordan','Amman','jo',3]].map((x,i)=>({id:'w'+i,country:x[0],capital:x[1],code:x[2],tier:x[3]}));function tier(){return level==='easy'?1:level==='medium'?2:3}function stats(){let s=$('stats');s.innerHTML='';players.forEach((p,i)=>{let d=document.createElement('div');d.className='pill'+(i===active?' active':'');d.textContent=(i===active?'👉 ':'')+p.name+'  ✅'+p.correct+'  ❌'+p.wrong;s.appendChild(d)});if(players.length)$('turn').textContent=pc===2?'🎯 '+players[active].name+' — YOUR TURN!':'🎯 '+players[0].name}function setPC(n){pc=n;$('one').classList.toggle('selected',n===1);$('two').classList.toggle('selected',n===2);$('p2row').classList.toggle('hidden',n===1)}$('one').onclick=()=>setPC(1);$('two').onclick=()=>setPC(2);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('selected',x===b))});function visual(v,img=false){$('img').classList.toggle('hidden',!img);$('emoji').classList.toggle('hidden',img);if(img)$('img').src=v;else $('emoji').textContent=v}function available(cat){return (BANK[cat]||[]).filter(q=>q.tier<=tier()&&!used.has(q.id))}function ask(cat){round++;$('progress').style.width=((round%10)||10)*10+'%';if(cat==='world')return askWorld();if(cat==='math')return askMath();let pool=available(cat);if(!pool.length)return finish(cat);let q=pool[Math.floor(Math.random()*pool.length)];used.add(q.id);let all=(BANK[cat]||[]).filter(x=>x.tier<=tier()&&x.a!==q.a),wrong=shuffle([...new Set(all.map(x=>x.a))]).slice(0,2);render(cat,q.q,q.a,[q.a,...wrong],q.v)}function render(cat,q,correct,opts,v,img=false){answered=false;let names={animals:'🐾 Animals',space:'🚀 Space',dinos:'🦖 Dinosaurs',landmarks:'🗽 Landmarks',math:'➕ Math',logos:'💡 Logos',food:'🍕 Food',world:'🌍 Geography'};$('eyebrow').textContent=(names[cat]||'🎲 Mixed')+' · '+level.toUpperCase();$('question').textContent=q;$('hint').textContent='Choose the best answer.';visual(v||'❓',img);$('feedback').textContent='';$('answers').innerHTML='';stats();shuffle(opts).forEach((x,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'.  '+x;b.onclick=()=>choose(b,x,correct);$('answers').appendChild(b)})}function askMath(){let t=tier(),a,b,op,ans,key,tries=0;do{if(t===1){a=1+Math.floor(Math.random()*20);b=1+Math.floor(Math.random()*20);op=Math.random()<.5?'+':'−';if(op==='−'&&b>a)[a,b]=[b,a];ans=op==='+'?a+b:a-b}else if(t===2){a=2+Math.floor(Math.random()*12);b=2+Math.floor(Math.random()*12);op='×';ans=a*b}else{b=2+Math.floor(Math.random()*12);ans=2+Math.floor(Math.random()*15);a=b*ans;op='÷'}key='math:'+a+op+b;tries++}while(mathUsed.has(key)&&tries<300);if(mathUsed.has(key))return finish('math');mathUsed.add(key);let d=t===1?1:Math.max(2,b);render('math',`What is ${a} ${op} ${b}?`,String(ans),[String(ans),String(ans+d),String(Math.max(0,ans-d))],'🧮')}function askWorld(){let pool=countries.filter(c=>c.tier<=tier());if(worldPhase==='new'){let fresh=pool.filter(c=>!used.has(c.id));if(!fresh.length)return finish('world');currentCountry=fresh[Math.floor(Math.random()*fresh.length)];used.add(currentCountry.id);worldPhase='flag'}let c=currentCountry;if(worldPhase==='flag'){let wrong=shuffle(pool.filter(x=>x.country!==c.country)).slice(0,2).map(x=>x.country);render('world','Which country has this flag?',c.country,[c.country,...wrong],'https://flagcdn.com/w320/'+c.code+'.png',true);worldPhase='capital'}else{let wrong=shuffle(pool.filter(x=>x.capital!==c.capital)).slice(0,2).map(x=>x.capital);render('world','What is the capital of '+c.country+'?',c.capital,[c.capital,...wrong],'🏛️');worldPhase='new'}}function choose(btn,picked,correct){if(answered)return;answered=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent.slice(4)===correct)b.classList.add('correct')});let p=players[active];if(picked===correct){p.correct++;btn.classList.add('correct');$('feedback').textContent='✅ Correct, '+p.name+'!';$('feedback').style.color='#16875b'}else{p.wrong++;btn.classList.add('wrong');$('feedback').textContent='❌ '+p.name+', the answer is '+correct+'.';$('feedback').style.color='#c13f3f'}stats();clearTimeout(timer);timer=setTimeout(next,1250)}function next(){if(pc===2)active=1-active;if(mode==='mixed'){let cats=['world','food','logos','animals','space','dinos','landmarks','math'],possible=cats.filter(c=>c==='math'||c==='world'||available(c).length);if(!possible.length)return finish('mixed');ask(possible[Math.floor(Math.random()*possible.length)])}else ask(mode)}function finish(cat){answered=true;$('eyebrow').textContent='🏆 GAME COMPLETE';$('question').textContent='No repeats — you finished the available questions!';$('hint').textContent='Great job! Start a new game to play again.';visual('🏆');$('answers').innerHTML='';$('feedback').textContent=players.map(p=>p.name+': '+p.correct+' correct').join('  •  ');stats()}function start(m){let a=$('p1').value.trim(),b=$('p2').value.trim();if(!a){$('msg').textContent='Please enter Player 1 name 🙂';return}if(pc===2&&!b){$('msg').textContent='Please enter Player 2 name 🙂';return}players=[{name:a,correct:0,wrong:0}];if(pc===2)players.push({name:b,correct:0,wrong:0});active=pc===2?1:0;round=0;mode=m;worldPhase='new';used=new Set();mathUsed=new Set();$('welcome').classList.add('hidden');$('game').classList.remove('hidden');next()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('menu').onclick=()=>{clearTimeout(timer);$('game').classList.add('hidden');$('welcome').classList.remove('hidden');$('stats').innerHTML='';$('progress').style.width='0'};</script></body></html>
