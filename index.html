<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d74"><title>World Explorer Quiz</title><style>
:root{--ink:#17324d;--muted:#6a7f95;--blue:#1e73d8;--green:#1aa66a;--red:#e04b4b;--shadow:0 18px 50px rgba(34,72,112,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-rounded,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eef7ff,#f8fbff 52%,#fff8df);display:flex;justify-content:center;align-items:center;padding:18px}.app{width:min(780px,100%)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-weight:900;font-size:clamp(20px,4vw,28px)}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#fff;border:1px solid #dfe9f2;border-radius:999px;padding:8px 11px;font-weight:800;font-size:13px}.pill.active{outline:3px solid rgba(30,115,216,.18);background:#eef7ff}.card{background:rgba(255,255,255,.96);border-radius:30px;box-shadow:var(--shadow);padding:clamp(20px,5vw,38px);text-align:center;overflow:hidden;position:relative}.progress{height:8px;background:#e9f0f6;border-radius:99px;overflow:hidden;margin-bottom:18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#3b8ff0,#45c67b);transition:width .35s}.turn-banner{display:block;width:fit-content;max-width:100%;margin:0 auto 12px;background:#e9f5ff;border:2px solid #78b7f1;color:#104f91;border-radius:18px;padding:11px 20px;font-size:clamp(18px,4.5vw,24px);font-weight:950}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;font-weight:900;color:var(--blue);margin-bottom:8px}h1{font-size:clamp(27px,6vw,42px);line-height:1.08;margin:0 0 10px}.sub{color:var(--muted);font-weight:650;margin:0 0 18px}.player-choice,.difficulty{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}.choice{border:2px solid #dfe9f2;background:#fff;border-radius:16px;padding:12px 18px;font-size:16px;font-weight:900;color:var(--ink);cursor:pointer}.choice.selected{border-color:#4b9aea;background:#eef7ff;color:#155ca9}.difficulty .choice[data-level="easy"].selected{border-color:#42b883;background:#edfbf5;color:#14734d}.difficulty .choice[data-level="medium"].selected{border-color:#e3aa2f;background:#fff8df;color:#805b00}.difficulty .choice[data-level="hard"].selected{border-color:#e46868;background:#fff0f0;color:#9f2d2d}.section-label{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#71869b;margin-top:20px}.names{max-width:500px;margin:14px auto 20px;display:grid;gap:10px}.name-row{text-align:left}.name-row label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}.name-input{width:100%;border:2px solid #dfe9f2;border-radius:15px;padding:13px 15px;font-size:17px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.mode{border:2px solid #dfe9f2;background:#fff;border-radius:20px;padding:18px 12px;cursor:pointer;color:var(--ink);font:inherit}.mode-icon{font-size:42px;display:block}.mode strong{display:block;font-size:17px}.mode small{display:block;color:var(--muted);font-weight:700;margin-top:5px}.visual{height:180px;display:flex;align-items:center;justify-content:center;margin:4px 0 22px}.flag{max-width:min(330px,84vw);max-height:170px;border-radius:16px;box-shadow:0 12px 30px rgba(29,55,80,.19);border:1px solid #ddd}.big-emoji{font-size:110px}.answers{display:grid;gap:12px;text-align:left}.answer{width:100%;border:2px solid #dfe9f2;background:#fff;border-radius:18px;padding:16px 18px;font-size:18px;font-weight:850;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px}.letter{display:grid;place-items:center;min-width:32px;height:32px;border-radius:10px;background:#edf5fd;color:var(--blue);font-size:14px}.answer.correct{border-color:#58c996;background:#ecfbf4;color:#116d49}.answer.wrong{border-color:#f28f8f;background:#fff0f0;color:#9f2d2d}.feedback{min-height:54px;margin-top:17px;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center}.ok{color:#16875b}.no{color:#c13f3f}.menu-btn{border:0;background:transparent;color:#5f7590;font-weight:850;padding:12px}.mini{font-size:12px;color:#8293a5;margin-top:15px}.hidden{display:none!important}@media(max-width:620px){body{align-items:flex-start;padding:12px}.top{align-items:flex-start}.pill{padding:6px 8px;font-size:11px}.card{border-radius:24px;padding:18px 15px}.modes{grid-template-columns:1fr}.mode{display:grid;grid-template-columns:50px 1fr;text-align:left;align-items:center;padding:13px}.mode-icon{grid-row:1/3}.mode strong,.mode small{grid-column:2}.visual{height:150px}.flag{max-height:140px}.big-emoji{font-size:90px}.answer{padding:14px;font-size:17px}.turn-banner{margin-top:2px}}
</style></head><body><main class="app"><div class="top"><div class="brand">🌎 World Explorer</div><div class="stats" id="stats"></div></div><section class="card"><div class="progress"><div id="progress"></div></div><div id="welcome"><div style="font-size:70px">🎮</div><div class="eyebrow">Choose your challenge</div><h1>Welcome to World Explorer!</h1><p class="sub">Choose players, names, difficulty, then pick a game.</p><div class="player-choice"><button id="onePlayer" class="choice selected">👤 1 Player</button><button id="twoPlayers" class="choice">👥 2 Players</button></div><div class="names"><div class="name-row"><label>Player 1 name</label><input class="name-input" id="player1" maxlength="24" placeholder="Type name"></div><div class="name-row hidden" id="player2Row"><label>Player 2 name</label><input class="name-input" id="player2" maxlength="24" placeholder="Type second name"></div></div><div class="section-label">Choose difficulty</div><div class="difficulty"><button class="choice selected" data-level="easy">🟢 Easy</button><button class="choice" data-level="medium">🟡 Medium</button><button class="choice" data-level="hard">🔴 Hard</button></div><div class="modes"><button class="mode" data-mode="world"><span class="mode-icon">🌍</span><strong>Flags & Countries</strong><small>Countries, capitals and U.S. states</small></button><button class="mode" data-mode="logos"><span class="mode-icon">💡</span><strong>Guess the Logo</strong><small>Choose the brand</small></button><button class="mode" data-mode="food"><span class="mode-icon">🍕</span><strong>Guess the Food</strong><small>Choose the food name</small></button></div><div class="mini" id="menuMessage">In 2-player mode, players alternate every question.</div></div><div id="game" class="hidden"><div class="turn-banner" id="turnBanner"></div><div class="eyebrow" id="eyebrow"></div><h1 id="question"></h1><p class="sub" id="hint"></p><div class="visual"><img id="visualImg" class="flag hidden" alt="Quiz image"><div id="visualEmoji" class="big-emoji hidden"></div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="menu-btn" id="menuBtn">← Change game</button></div></section></main><script>
const countries=[['United States','Washington, D.C.','us',1],['Canada','Ottawa','ca',1],['Mexico','Mexico City','mx',1],['United Kingdom','London','gb',1],['France','Paris','fr',1],['Germany','Berlin','de',1],['Italy','Rome','it',1],['Spain','Madrid','es',1],['Japan','Tokyo','jp',1],['China','Beijing','cn',1],['India','New Delhi','in',1],['Israel','Jerusalem','il',1],['Brazil','Brasília','br',1],['Australia','Canberra','au',1],['Argentina','Buenos Aires','ar',2],['Greece','Athens','gr',2],['Ireland','Dublin','ie',2],['Portugal','Lisbon','pt',2],['Netherlands','Amsterdam','nl',2],['Sweden','Stockholm','se',2],['Norway','Oslo','no',2],['Denmark','Copenhagen','dk',2],['Poland','Warsaw','pl',2],['Austria','Vienna','at',2],['Belgium','Brussels','be',2],['Switzerland','Bern','ch',2],['South Korea','Seoul','kr',2],['Thailand','Bangkok','th',2],['Turkey','Ankara','tr',2],['Egypt','Cairo','eg',2],['Saudi Arabia','Riyadh','sa',2],['United Arab Emirates','Abu Dhabi','ae',2],['Chile','Santiago','cl',2],['Colombia','Bogotá','co',2],['Peru','Lima','pe',2],['New Zealand','Wellington','nz',2],['Finland','Helsinki','fi',3],['Iceland','Reykjavík','is',3],['Hungary','Budapest','hu',3],['Romania','Bucharest','ro',3],['Croatia','Zagreb','hr',3],['Czechia','Prague','cz',3],['Ukraine','Kyiv','ua',3],['Jordan','Amman','jo',3],['Kenya','Nairobi','ke',3],['Nigeria','Abuja','ng',3],['Morocco','Rabat','ma',3],['Costa Rica','San José','cr',3],['Cuba','Havana','cu',3],['Dominican Republic','Santo Domingo','do',3],['Ecuador','Quito','ec',3],['Panama','Panama City','pa',3],['Philippines','Manila','ph',3],['Indonesia','Jakarta','id',3],['Singapore','Singapore','sg',3],['South Africa','Pretoria','za',3],['Uruguay','Montevideo','uy',3],['Vietnam','Hanoi','vn',3]].map(([country,capital,code,tier])=>({country,capital,code,tier}));
const states=[['New York','Albany',1],['California','Sacramento',1],['Texas','Austin',1],['Florida','Tallahassee',1],['Massachusetts','Boston',1],['Georgia','Atlanta',1],['Arizona','Phoenix',1],['Colorado','Denver',1],['Ohio','Columbus',1],['Hawaii','Honolulu',1],['Illinois','Springfield',2],['Pennsylvania','Harrisburg',2],['New Jersey','Trenton',2],['Virginia','Richmond',2],['Washington','Olympia',2],['Oregon','Salem',2],['Michigan','Lansing',2],['Minnesota','Saint Paul',2],['Indiana','Indianapolis',2],['Tennessee','Nashville',2],['Alabama','Montgomery',3],['Alaska','Juneau',3],['Arkansas','Little Rock',3],['Connecticut','Hartford',3],['Delaware','Dover',3],['Idaho','Boise',3],['Iowa','Des Moines',3],['Kansas','Topeka',3],['Kentucky','Frankfort',3],['Louisiana','Baton Rouge',3],['Maine','Augusta',3],['Maryland','Annapolis',3],['Mississippi','Jackson',3],['Missouri','Jefferson City',3],['Montana','Helena',3],['Nebraska','Lincoln',3],['Nevada','Carson City',3],['New Hampshire','Concord',3],['New Mexico','Santa Fe',3],['North Carolina','Raleigh',3],['North Dakota','Bismarck',3],['Oklahoma','Oklahoma City',3],['Rhode Island','Providence',3],['South Carolina','Columbia',3],['South Dakota','Pierre',3],['Utah','Salt Lake City',3],['Vermont','Montpelier',3],['West Virginia','Charleston',3],['Wisconsin','Madison',3],['Wyoming','Cheyenne',3]].map(([state,capital,tier])=>({state,capital,tier}));
const logos=['Apple','Google','Nike','Adidas','McDonald’s','YouTube','Netflix','Amazon','Microsoft','Spotify','Instagram','TikTok','PlayStation','Xbox','Lego','Reddit','Discord','Tesla','Starbucks','Airbnb'].map((name,i)=>({name,slug:['apple','google','nike','adidas','mcdonalds','youtube','netflix','amazon','microsoft','spotify','instagram','tiktok','playstation','xbox','lego','reddit','discord','tesla','starbucks','airbnb'][i]}));const foods=[['Pizza','🍕'],['Hamburger','🍔'],['French Fries','🍟'],['Hot Dog','🌭'],['Taco','🌮'],['Burrito','🌯'],['Sushi','🍣'],['Spaghetti','🍝'],['Pancakes','🥞'],['Waffle','🧇'],['Donut','🍩'],['Cookie','🍪'],['Cake','🍰'],['Ice Cream','🍦'],['Popcorn','🍿'],['Pretzel','🥨'],['Croissant','🥐'],['Cheese','🧀'],['Avocado','🥑'],['Watermelon','🍉'],['Strawberry','🍓'],['Pineapple','🍍'],['Banana','🍌'],['Apple','🍎'],['Carrot','🥕'],['Corn','🌽'],['Broccoli','🥦'],['Egg','🥚'],['Bacon','🥓'],['Shrimp','🍤']].map(([name,emoji])=>({name,emoji}));
const $=id=>document.getElementById(id);let playerCount=1,players=[],activePlayer=0,round=0,current=null,phase='flag',answered=false,mode='world',level='easy',timer=null;const shuffle=a=>[...a].sort(()=>Math.random()-.5);const pool=arr=>arr.filter(x=>!x.tier||x.tier<=(level==='easy'?1:level==='medium'?2:3));const wrong=(arr,correct,key)=>shuffle(arr.filter(x=>x[key]!==correct)).slice(0,2).map(x=>x[key]);
function selectPlayers(n){playerCount=n;$('onePlayer').classList.toggle('selected',n===1);$('twoPlayers').classList.toggle('selected',n===2);$('player2Row').classList.toggle('hidden',n===1)}$('onePlayer').onclick=()=>selectPlayers(1);$('twoPlayers').onclick=()=>selectPlayers(2);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('selected',x===b))});
function stats(){const s=$('stats');s.innerHTML='';players.forEach((p,i)=>{const d=document.createElement('div');d.className='pill'+(i===activePlayer?' active':'');d.textContent=`${i===activePlayer?'👉 ':''}${p.name} ✅${p.correct} ❌${p.wrong}`;s.appendChild(d)});if(players.length)$('turnBanner').textContent=playerCount===2?`🎯 ${players[activePlayer].name} — YOUR TURN!`:`🎯 ${players[0].name}`}
function image(src){$('visualEmoji').classList.add('hidden');$('visualImg').src=src;$('visualImg').classList.remove('hidden')}function emoji(v){$('visualImg').classList.add('hidden');$('visualEmoji').textContent=v;$('visualEmoji').classList.remove('hidden')}function answers(vals,correct){answered=false;$('feedback').textContent='';$('feedback').className='feedback';$('answers').innerHTML='';stats();shuffle(vals).forEach((t,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${t}</span>`;b.onclick=()=>choose(b,t,correct);$('answers').appendChild(b)})}function bump(){round++;$('progress').style.width=((round%10)||10)*10+'%'}
function newCountry(){const p=pool(countries);current=p[Math.floor(Math.random()*p.length)];phase='flag';countryFlag()}function countryFlag(){bump();$('eyebrow').textContent=`🌍 ${level.toUpperCase()} · Flag challenge`;$('question').textContent='Which country has this flag?';$('hint').textContent='Look carefully, then choose one answer.';image(`https://flagcdn.com/w320/${current.code}.png`);const p=pool(countries);answers([current.country,...wrong(p,current.country,'country')],current.country)}function capital(){bump();$('eyebrow').textContent=`🏛️ ${level.toUpperCase()} · Capital challenge`;$('question').textContent=`What is the capital of ${current.country}?`;$('hint').textContent='Same country — now test the capital!';image(`https://flagcdn.com/w320/${current.code}.png`);const p=pool(countries);answers([current.capital,...wrong(p,current.capital,'capital')],current.capital)}function state(){bump();const p=pool(states),s=p[Math.floor(Math.random()*p.length)];current=s;phase='state';$('eyebrow').textContent=`🇺🇸 ${level.toUpperCase()} · U.S. challenge`;$('question').textContent=`What is the capital of ${s.state}?`;$('hint').textContent='Choose the state capital.';emoji('🇺🇸');answers([s.capital,...wrong(p,s.capital,'capital')],s.capital)}function logo(){bump();current=logos[Math.floor(Math.random()*logos.length)];phase='logo';$('eyebrow').textContent=`💡 ${level.toUpperCase()} · Logo challenge`;$('question').textContent='Which brand has this logo?';$('hint').textContent='Pick the correct brand.';image(`https://cdn.simpleicons.org/${current.slug}`);answers([current.name,...wrong(logos,current.name,'name')],current.name)}function food(){bump();current=foods[Math.floor(Math.random()*foods.length)];phase='food';$('eyebrow').textContent=`🍽️ ${level.toUpperCase()} · Food challenge`;$('question').textContent='What food is this?';$('hint').textContent='Choose the name.';emoji(current.emoji);answers([current.name,...wrong(foods,current.name,'name')],current.name)}
function next(){if(playerCount===2)activePlayer=1-activePlayer;if(mode==='world'){if(phase==='flag'){phase='capital';capital()}else if(phase==='capital'){Math.random()<(level==='easy'?.12:level==='medium'?.22:.32)?state():newCountry()}else newCountry()}else if(mode==='logos')logo();else food()}function choose(btn,picked,correct){if(answered)return;answered=true;const p=players[activePlayer];document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.querySelector('span:last-child').textContent===correct)b.classList.add('correct')});if(picked===correct){p.correct++;p.streak++;btn.classList.add('correct');$('feedback').textContent=`✅ Correct, ${p.name}!`;$('feedback').classList.add('ok')}else{p.wrong++;p.streak=0;btn.classList.add('wrong');$('feedback').textContent=`❌ ${p.name}, the answer is ${correct}.`;$('feedback').classList.add('no')}stats();clearTimeout(timer);timer=setTimeout(next,1400)}
function start(m){const n1=$('player1').value.trim(),n2=$('player2').value.trim();if(!n1){$('menuMessage').textContent='Please enter Player 1 name first 🙂';return}if(playerCount===2&&!n2){$('menuMessage').textContent='Please enter Player 2 name first 🙂';return}players=[{name:n1,correct:0,wrong:0,streak:0}];if(playerCount===2)players.push({name:n2,correct:0,wrong:0,streak:0});activePlayer=0;round=0;mode=m;$('welcome').classList.add('hidden');$('game').classList.remove('hidden');stats();mode==='world'?newCountry():mode==='logos'?logo():food()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('menuBtn').onclick=()=>{clearTimeout(timer);$('game').classList.add('hidden');$('welcome').classList.remove('hidden');$('stats').innerHTML='';$('progress').style.width='0'};
</script></body></html>
